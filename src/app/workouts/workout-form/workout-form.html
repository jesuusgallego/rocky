<form class="card" [formRoot]="workoutForm">
  <h2>Nuevo registro</h2>

  <div class="grid">
    <label class="field">
      <span>Fecha</span>
      <input type="date" [formField]="workoutForm.date" />
      @if (workoutForm.date().touched()) {
        @for (error of workoutForm.date().errors(); track error.kind) {
          <small class="error">{{ error.message }}</small>
        }
      }
    </label>

    <label class="field">
      <span>Ejercicio</span>
      <input
        type="text"
        list="exercise-names"
        placeholder="Ej.: Sentadilla"
        [formField]="workoutForm.exercise"
      />
      @if (workoutForm.exercise().touched()) {
        @for (error of workoutForm.exercise().errors(); track error.kind) {
          <small class="error">{{ error.message }}</small>
        }
      }
    </label>

    <label class="field">
      <span>Series</span>
      <input type="number" inputmode="numeric" [formField]="workoutForm.sets" />
      @if (workoutForm.sets().touched()) {
        @for (error of workoutForm.sets().errors(); track error.kind) {
          <small class="error">{{ error.message }}</small>
        }
      }
    </label>

    <label class="field">
      <span>Repeticiones</span>
      <input type="number" inputmode="numeric" [formField]="workoutForm.reps" />
      @if (workoutForm.reps().touched()) {
        @for (error of workoutForm.reps().errors(); track error.kind) {
          <small class="error">{{ error.message }}</small>
        }
      }
    </label>

    <label class="field">
      <span>Peso (kg)</span>
      <input type="number" inputmode="decimal" step="0.5" [formField]="workoutForm.weightKg" />
      @if (workoutForm.weightKg().touched()) {
        @for (error of workoutForm.weightKg().errors(); track error.kind) {
          <small class="error">{{ error.message }}</small>
        }
      }
    </label>
  </div>

  <!-- Sugerencias para el campo "Ejercicio" con los nombres que ya has usado -->
  <datalist id="exercise-names">
    @for (name of store.exerciseNames(); track name) {
      <option [value]="name"></option>
    }
  </datalist>

  <button type="submit">Guardar</button>
</form>
